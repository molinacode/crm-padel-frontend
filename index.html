<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <!-- Preconnect hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fuente principal. Sin onload en línea: lo bloquearía la CSP del servidor. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Optimizaciones para móviles -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta
      name="description"
      content="Sistema de gestión completo para academia de pádel - CRM Pádel"
    />
    <meta
      name="keywords"
      content="pádel, academia, gestión, CRM, clases, alumnos, profesores"
    />
    <meta name="author" content="CRM Pádel" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM Pádel" />

    <!-- Android Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="CRM Pádel" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="CRM Pádel" />
    <meta
      property="og:description"
      content="Sistema de gestión completo para academia de pádel"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRM Pádel" />
    <meta
      name="twitter:description"
      content="Sistema de gestión completo para academia de pádel"
    />
    <meta name="twitter:image" content="/icon-512x512.png" />

    <title>CRM Pádel</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
